<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Dark Squircle -->
  <rect width="512" height="512" rx="128" fill="#0A0E17" />

  <defs>
    <!-- Gradient Biru Cyan Modern Khas Go -->
    <linearGradient id="kuStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="60%" stop-color="#00A3FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <!-- Halus Bayangan Cahaya -->
    <filter id="kuGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00A3FF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Sketsa Bentuk Persis Gambar Pengguna: Huruf k kecil dengan kaki kanan melengkung ke bawah dan naik jadi 'u' -->
  <g filter="url(#kuGlow)">
    <!-- 1. Batang Kiri Huruf k (Tinggi, Vertikal Lembut) -->
    <path d="M 124,84 L 124,420" 
          stroke="url(#kuStrokeGrad)" 
          stroke-width="56" 
          stroke-linecap="round" />

    <!-- 2. Lengan Atas k (Diagonal ke Kanan Atas) -->
    <path d="M 148,220 L 296,88" 
          stroke="url(#kuStrokeGrad)" 
          stroke-width="54" 
          stroke-linecap="round" />

    <!-- 3. Kaki Kanan k yang Mengalir Melengkung Membentuk Huruf u -->
    <!-- Dimulai dari sambungan tengah, turun meliuk ke bawah lalu melengkung naik membentuk huruf 'u' persis sketsa -->
    <path d="M 174,236 
             C 240,240 270,280 276,330 
             C 284,395 330,446 388,432 
             C 434,420 448,356 440,270" 
          stroke="url(#kuStrokeGrad)" 
          stroke-width="54" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none" />
  </g>
</svg>
