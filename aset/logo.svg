<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Dark Squircle 1:1 -->
  <rect width="512" height="512" rx="128" fill="#0A0E17" />

  <defs>
    <!-- Gradient Cyan ke Electric Blue khas Go -->
    <linearGradient id="kuStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="60%" stop-color="#00A3FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <!-- Glow Halus -->
    <filter id="kuGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00A3FF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Bentuk Monogram K Lengkap Persis Sketsa Gambar -->
  <g filter="url(#kuGlow)">
    <!-- 1. Batang Utama Vertikal (Kiri Huruf K) -->
    <path d="M 120,96 L 120,416" 
          stroke="url(#kuStrokeGrad)" 
          stroke-width="56" 
          stroke-linecap="round" />

    <!-- 2. Lengan Atas K (Diagonal ke Kanan Atas) -->
    <path d="M 148,220 L 290,96" 
          stroke="url(#kuStrokeGrad)" 
          stroke-width="54" 
          stroke-linecap="round" />

    <!-- 3. KAKI BAWAH K (Bagian Kiri-Bawah K) -->
    <path d="M 148,250 L 220,340" 
          stroke="url(#kuStrokeGrad)" 
          stroke-width="54" 
          stroke-linecap="round" />

    <!-- 4. LENGKUNGAN KAKI KANAN KE BAWAH LALU NAIK JADI 'u' (Persis Sketsa) -->
    <path d="M 210,250 
             C 255,270 270,305 275,345 
             C 282,395 316,424 366,416 
             C 414,408 436,365 432,295 
             L 430,240" 
          stroke="url(#kuStrokeGrad)" 
          stroke-width="54" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none" />
  </g>
</svg>
