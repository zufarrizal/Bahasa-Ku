<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Clean Dark Canvas -->
  <rect width="512" height="512" rx="120" fill="#090D16" />

  <!-- Geometric Polygonal Monogram K -->
  <g>
    <!-- Left Vertical Pillar (Gradient Cyan-Blue) -->
    <defs>
      <linearGradient id="pilarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00D2FF" />
        <stop offset="100%" stop-color="#0077FF" />
      </linearGradient>

      <!-- Upper Diagonal Wing -->
      <linearGradient id="wingUpGrad" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00F0FF" />
        <stop offset="100%" stop-color="#7000FF" />
      </linearGradient>

      <!-- Lower Diagonal Wing -->
      <linearGradient id="wingDownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0077FF" />
        <stop offset="100%" stop-color="#00E5FF" />
      </linearGradient>
    </defs>

    <!-- Batang Vertikal K (Tajam, Presisi) -->
    <path d="M 120,116 L 192,116 L 192,396 L 120,396 Z" fill="url(#pilarGrad)" />

    <!-- Sayap Atas K (Bentuk Geometris Bersih) -->
    <path d="M 216,236 L 332,116 L 416,116 L 272,260 Z" fill="url(#wingUpGrad)" />

    <!-- Sayap Bawah K (Bentuk Geometris Bersih) -->
    <path d="M 244,232 L 416,396 L 332,396 L 192,264 Z" fill="url(#wingDownGrad)" />

    <!-- Aksen Titik Geometris Minimalis (Dot Core) -->
    <polygon points="192,220 236,256 192,292" fill="#090D16" />
  </g>
</svg>
