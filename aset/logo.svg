<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Cyan Blue to Deep Indigo khas Go modern) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ADD8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Accent Gradient Merah Putih Elegan -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" />

  <!-- Inner Soft Border -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="6" />

  <!-- Red-White Flag Accent Badge (Nuansa Indonesia yang Modern & Minimalis) -->
  <g transform="translate(376, 56)">
    <!-- Pita Merah Putih Dinamis -->
    <path d="M 0,0 L 52,0 C 62,0 70,8 70,18 L 70,54 L 35,40 L 0,54 Z" fill="url(#accentGrad)" />
    <path d="M 0,27 L 70,27 L 70,54 L 35,40 L 0,54 Z" fill="#FFFFFF" />
  </g>

  <!-- Center Monogram "Ku" -->
  <g filter="url(#glow)">
    <!-- Huruf K (Besar, Kokoh, Geometris Khas Bahasa Pemrograman Modern) -->
    <!-- Batang Utama K -->
    <rect x="96" y="140" width="44" height="232" rx="16" fill="#FFFFFF" />
    
    <!-- Kaki Atas K (Diagonal) -->
    <path d="M 148,260 L 228,154 C 235,145 248,143 257,150 L 274,163 C 283,170 284,183 277,192 L 194,295 Z" fill="#FFFFFF" />

    <!-- Kaki Bawah K (Diagonal) -->
    <path d="M 182,274 L 273,356 C 282,364 283,377 275,386 L 258,401 C 249,410 236,410 227,402 L 138,322 Z" fill="#FFFFFF" />

    <!-- Huruf u (Kecil, Melengkung Lembut Khas Go Gopher Vibe) -->
    <!-- Tiang Kiri 'u' -->
    <rect x="296" y="212" width="38" height="116" rx="12" fill="#38BDF8" />

    <!-- Lengkungan Bawah 'u' -->
    <path d="M 296,280 C 296,358 392,358 392,280 L 392,212 C 392,204 398,198 406,198 L 416,198 C 424,198 430,204 430,212 L 430,344 C 430,352 424,358 416,358 L 398,358 C 394,358 390,356 388,352 L 382,342 C 366,364 340,374 312,368 C 282,362 260,336 258,304 C 257,288 258,260 258,260 Z" fill="none" />

    <!-- Bentuk U Solid Presisi -->
    <path d="M 296,212 C 296,204 302,198 310,198 L 324,198 C 332,198 338,204 338,212 L 338,284 C 338,318 376,318 376,284 L 376,212 C 376,204 382,198 390,198 L 404,198 C 412,198 418,204 418,212 L 418,354 C 418,362 412,368 404,368 L 390,368 C 384,368 378,364 376,358 L 374,350 C 358,366 338,374 316,370 C 286,364 266,336 266,298 L 266,212 C 266,204 272,198 280,198 L 282,198 C 290,198 296,204 296,212 Z" fill="#38BDF8" />
  </g>

  <!-- Tagline Mini: ID / INDONESIA di bagian bawah -->
  <text x="256" y="442" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="6" fill="#A5F3FC" opacity="0.85">BAHASA KU</text>
</svg>
