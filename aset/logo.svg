<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Dark Squircle Proporsi 1:1 Sempurna -->
  <rect width="512" height="512" rx="128" fill="#0A0E17" />

  <defs>
    <!-- Gradient Cyan ke Electric Blue -->
    <linearGradient id="kuStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="60%" stop-color="#00A3FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <!-- Halus Bayangan Cahaya -->
    <filter id="kuGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00A3FF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Sketsa Simetris Kotak 1:1 (Lebar ~360, Tinggi ~360, Center di Kanvas 512x512) -->
  <g filter="url(#kuGlow)">
    <!-- 1. Batang Kiri k (Tinggi proporsional, tidak jangkung: Y=96 sampai Y=416) -->
    <path d="M 120,96 L 120,416" 
          stroke="url(#kuStrokeGrad)" 
          stroke-width="58" 
          stroke-linecap="round" />

    <!-- 2. Lengan Atas k (Sudut pas 45 derajat menuju X=290, Y=96) -->
    <path d="M 148,220 L 290,96" 
          stroke="url(#kuStrokeGrad)" 
          stroke-width="56" 
          stroke-linecap="round" />

    <!-- 3. Kaki Kanan k yang melengkung jadi 'u' (Tinggi ekor sejajar tengah/bawah, proporsi 1:1 lebar x tinggi) -->
    <!-- Turun dari Y=230, melengkung di dasar Y=416, naik ke ekor u di Y=240 (seimbang, tidak kepanjangan) -->
    <path d="M 166,236 
             C 230,240 256,270 264,320 
             C 272,375 304,416 356,416 
             C 406,416 430,375 426,300 
             L 426,240" 
          stroke="url(#kuStrokeGrad)" 
          stroke-width="56" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none" />
  </g>
</svg>
